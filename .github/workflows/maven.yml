name: Java CI

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    env:
      GITHUB_ACTION: true
      DISPLAY: :99.0
      GITHUB_PKG_TOKEN: ${{ secrets.REPO_TOKEN }}
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 11
      id: jdk11
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '11'

    - name: Set up JDK 1.8
      id: jdk8
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '8'
        cache: maven

    - name: run/xfb
      run: "/sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -ac -screen 0 1280x1024x16"

    - name: Build with Maven
      run: mvn -T 1C -s .github/workflows/settings.xml  -B package -Djava8.home=${{ steps.jdk8.outputs.path }} -Djava11.home=${{ steps.jdk11.outputs.path }}  --file pom.xml